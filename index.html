async function load(){const [s,b,a]=await Promise.all([sb.from('roster_slots').select('*').order('start_time'),sb.from('roster_bookings').select('*').gte('booking_date',ymd(plus(week,-14))).lte('booking_date',ymd(plus(week,50))),sb.rpc('is_roster_admin')]); if(s.error)throw s.error;if(b.error)throw b.error;slots=s.data||[];bookings=b.data||[];admin=a.data===true;render();}

const mins=t=>{let [h,m]=t.split(':').map(Number);return h*60+m};
function render(){let first=week,last=plus(week,4);root.innerHTML=`<header><div><div class="eyebrow">Nanyang Business School</div><h1>Social Media Publishing Roster</h1><small>Dedicated publishing windows and ad-hoc bookings · Singapore time</small></div><div class="controls"><small>${esc(session.user.email)}</small><button id="signout" class="btn">Sign out</button></div></header><main><section class="panel"><div class="toolbar"><div><h2>Week of ${nice(first)} – ${nice(last)} ${last.getFullYear()}</h2><small>Live, shared roster · ${slots.filter(s=>s.active&&s.kind==='adhoc').length} weekly ad-hoc windows</small></div><div class="controls"><button class="btn" id="prev">← Previous</button><button class="btn" id="today">Current week</button><button class="btn" id="next">Next →</button><button class="btn" id="refresh">Refresh</button></div></div><div id="notice" class="notice hidden"></div><div class="legend">${Object.entries(colours).map(([n,c])=>`<span><i class="swatch" style="--c:${c[0]}"></i>${esc(n)}</span>`).join('')}</div><div class="calendar-scroll"><div class="grid-head"><div></div>${weekdays.map((d,i)=>`<div class="dayhead">${d}<span>${nice(plus(week,i))}</span></div>`).join('')}</div><div class="calendar"><div class="times">${Array.from({length:20},(_,i)=>`<div>${niceTime(`${String(8+Math.floor(i/2)).padStart(2,'0')}:${i%2?'30':'00'}`)}</div>`).join('')}</div>${weekdays.map((d,i)=>{let date=ymd(plus(week,i));return `<div class="day">${slots.filter(s=>s.active&&s.weekday===i+1).map(s=>cellSlot(s,date)).join('')}</div>`}).join('')}</div></div></section><section class="panel"><div class="toolbar"><div><h2>Upcoming open ad-hoc slots</h2><small>Next 30 days from today, excluding elapsed windows</small></div><div class="controls"><button id="import" class="btn">Import bookings</button>${admin?'<button id="manage" class="btn">Manage dedicated slots</button>':''}</div></div><div class="stats" id="stats"></div><div class="cards" id="open"></div></section><div class="footer">Access is enforced in Supabase. Only approved signed-in users can read or change the roster.</div></main><div id="modalMount"></div>`;
$('#signout').onclick=async()=>await sb.auth.signOut();$('#prev').onclick=()=>changeWeek(-7);$('#next').onclick=()=>changeWeek(7);$('#today').onclick=()=>{week=dayMonday(new Date());load().catch(showLoadError)};$('#refresh').onclick=()=>load().catch(showLoadError);$('#import').onclick=showImport;if(admin)$('#manage').onclick=showManage;document.querySelectorAll('[data-slot]').forEach(x=>x.onclick=()=>openSlot(x.dataset.slot,x.dataset.date));renderOpen()}
function renderOpen(){const current=new Date();let upcoming=[];for(let i=0;i<30;i++){let dt=plus(current,i),w=(dt.getDay()+6)%7+1,ds=ymd(dt);for(const s of slots.filter(s=>s.active&&s.kind==='adhoc'&&s.weekday===w)){if(!findBooking(s.id,ds)&&!slotPast(ds,s.end_time))upcoming.push({s,ds});}}let max=upcoming.length;$('#stats').innerHTML=`<div class="stat"><strong>${max}</strong><span>Open in the next 30 days</span></div><div class="stat"><strong>${slots.filter(s=>s.active&&s.kind==='adhoc').length}</strong><span>Weekly ad-hoc windows</span></div>`;$('#open').innerHTML=upcoming.slice(0,40).map(({s,ds})=>`<button class="open-card" data-open-slot="${s.id}" data-open-date="${ds}"><strong>${esc(weekdays[s.weekday-1])}, ${nice(dateOf(ds))}</strong><small>${niceTime(s.start_time)}–${niceTime(s.end_time)}</small><span class="pill">Open · Book</span></button>`).join('')+(upcoming.length>40?`<p class="muted">Showing the first 40 of ${upcoming.length} available windows.</p>`:'');document.querySelectorAll('[data-open-slot]').forEach(x=>x.onclick=()=>openSlot(x.dataset.openSlot,x.dataset.openDate))}
async function changeWeek(n){week=plus(week,n);try{await load()}catch(e){showLoadError(e)}}const showLoadError=e=>uiNotice(readErr(e),true);
function modal(title,body){$('#modalMount').innerHTML=`<div class="modal-layer" id="shade"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>${esc(title)}</h2><button id="closeModal" class="btn">✕</button></div>${body}<div class="notice hidden" id="modalNote"></div></div></div>`;$('#closeModal').onclick=closeModal;$('#shade').onclick=e=>{if(e.target.id==='shade')closeModal()}}function closeModal(){let m=$('#modalMount');if(m)m.innerHTML=''}function report(m,error=true){let n=$('#modalNote');if(n){n.className='notice '+(error?'error':'success');n.textContent=m;n.classList.remove('hidden')}}
function openSlot(id,date){let s=slots.find(x=>x.id===id);if(!s)return;let b=findBooking(id,date),past=slotPast(date,s.end_time);if(s.kind!=='adhoc'){if(admin)showManage(s.id);return}let title=`${nice(dateOf(date))} · ${niceTime(s.start_time)}–${niceTime(s.end_time)}`;if(past){modal(title,`<p>This slot is in the past and can no longer be edited.</p>${b?`<p><strong>${esc(b.team)}:</strong> ${esc(b.topic)}</p>`:''}`);return}modal(title,`<form id="bookForm"><div class="field"><label>Team *</label><input name="team" required maxlength="100" value="${esc(b?.team||'')}" placeholder="e.g. Graduate Studies"/></div><div class="field"><label>Post topic / campaign *</label><input name="topic" required maxlength="240" value="${esc(b?.topic||'')}" placeholder="Describe what will be published"/></div><div class="field"><label>Named recurring series (optional)</label><input name="series" maxlength="160" value="${esc(b?.series_name||'')}" placeholder="e.g. Alumni Spotlight"/></div>${b?'':`<div class="checkline"><input id="weekly" type="checkbox"/><label for="weekly">Repeat weekly</label></div><div id="recurringFields" class="hidden"><div class="field"><label>Number of occurrences (2–26)</label><input id="count" type="number" min="2" max="26" value="4"/></div></div>`}<div class="row"><button class="btn primary" type="submit">${b?'Save changes':'Confirm booking'}</button>${b?'<button type="button" class="btn danger" id="cancelBooking">Cancel booking</button>':''}</div></form>`);if(!b){$('#weekly').onchange=e=>$('#recurringFields').classList.toggle('hidden',!e.target.checked)}$('#bookForm').onsubmit=async e=>{e.preventDefault();let fd=new FormData(e.target),team=fd.get('team').trim(),topic=fd.get('topic').trim(),series=fd.get('series').trim();if(!team||!topic)return report('Team and topic are required');try{let err;if(b){({error:err}=await sb.from('roster_bookings').update({team,topic,series_name:series||null}).eq('id',b.id))}else if($('#weekly')?.checked){let count=+$('#count').value;if(!series)return report('Give the recurring series a name');if(count<2||count>26)return report('Choose 2–26 occurrences');({error:err}=await sb.rpc('book_roster_series',{p_slot_id:s.id,p_start_date:date,p_count:count,p_team:team,p_topic:topic,p_series_name:series}))}else{({error:err}=await sb.from('roster_bookings').insert({slot_id:s.id,booking_date:date,team,topic,series_name:series||null}))}if(err)throw err;closeModal();await load();uiNotice('Booking saved.')}catch(ex){report(readErr(ex))}};if(b)$('#cancelBooking').onclick=async()=>{if(!confirm('Cancel this booking? The slot will become open again.'))return;const {error}=await sb.from('roster_bookings').delete().eq('id',b.id);if(error)return report(readErr(error));closeModal();await load()}}
function showManage(selected){if(!admin)return;modal('Manage dedicated and ad-hoc slots',`<p class="muted">Changes to these recurring windows apply to future calendar views. Existing bookings remain attached to the original slot; deactivate instead of deleting.</p><div class="field"><label>Slot</label><select id="slotSelect">${slots.map(s=>`<option value="${s.id}" ${s.id===selected?'selected':''}>${esc(weekdays[s.weekday-1])} · ${niceTime(s.start_time)} · ${esc(s.team)}${s.active?'':' (inactive)'}</option>`).join('')}</select></div><form id="slotForm"><div class="row"><div class="field"><label>Day</label><select name="weekday">${weekdays.map((d,i)=>`<option value="${i+1}">${d}</option>`).join('')}</select></div><div class="field"><label>Type</label><select name="kind"><option value="dedicated">Dedicated</option><option value="adhoc">Ad-hoc</option></select></div></div><div class="field"><label>Team / label</label><input name="team" required/></div><div class="row"><div class="field"><label>Start time</label><input name="start" type="time" required/></div><div class="field"><label>End time</label><input name="end" type="time" required/></div><div class="field"><label>Lane</label><select name="lane"><option value="">Full</option><option value="A">Left</option><option value="B">Right</option></select></div></div><label class="checkline"><input name="active" type="checkbox"/> Active</label><div class="row"><button class="btn primary" type="submit">Save slot</button><button class="btn" id="newSlot" type="button">Add new slot</button></div></form>`);let original=true;function populate(){let s=slots.find(x=>x.id===$('#slotSelect').value);if(!s)return;let f=$('#slotForm');f.elements.weekday.value=s.weekday;f.elements.kind.value=s.kind;f.elements.team.value=s.team;f.elements.start.value=s.start_time.slice(0,5);f.elements.end.value=s.end_time.slice(0,5);f.elements.lane.value=s.lane||'';f.elements.active.checked=s.active;original=true}$('#slotSelect').onchange=populate;populate();$('#newSlot').onclick=()=>{original=false;$('#slotForm').reset();$('#slotForm').elements.active.checked=true;report('New slot mode selected.',false)};$('#slotForm').onsubmit=async e=>{e.preventDefault();let f=e.target,v={weekday:+f.elements.weekday.value,kind:f.elements.kind.value,team:f.elements.team.value.trim(),start_time:f.elements.start.value,end_time:f.elements.end.value,lane:f.elements.lane.value||null,active:f.elements.active.checked};if(v.start_time>=v.end_time)return report('End time must follow start time');let r=original?await sb.from('roster_slots').update(v).eq('id',$('#slotSelect').value):await sb.from('roster_slots').insert(v);if(r.error)return report(readErr(r.error));closeModal();await load();uiNotice('Slot configuration saved.')}}
function showImport(){issues=[];modal('Import bookings from Excel',`<p class="muted">Select an Excel workbook or CSV. Nothing is written until you review and select Import valid rows. Your file remains unchanged.</p><input type="file" id="file" accept=".xlsx,.xls,.csv"/><p class="muted">Expected column headings: <strong>Date, Time (or Slot), Team, Topic</strong>, optionally Series. Each row must identify a configured ad-hoc slot.</p><div id="preview"></div>`);$('#file').onchange=async e=>{try{let file=e.target.files[0];if(!file)return;const XLSX=await import('https://esm.sh/xlsx@0.18.5');const data=await file.arrayBuffer(),wb=XLSX.read(data,{type:'array',cellDates:true}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});preview(rows)}catch(err){report('Could not read workbook: '+readErr(err))}}}
function excelDate(v){if(v instanceof Date&&!isNaN(v))return ymd(v);if(typeof v==='number'){let d=new Date(Date.UTC(1899,11,30)+v*86400000);return d.toISOString().slice(0,10)}let s=String(v||'').trim();if(/^\d{4}-\d\d-\d\d/.test(s))return s.slice(0,10);let d=new Date(s);return isNaN(d)?'':ymd(d)}
function preview(rows){let prepared=[],errors=[],seen=new Set();for(const [i,row] of rows.entries()){let m=Object.fromEntries(Object.entries(row).map(([k,v])=>[k.toLowerCase().replace(/[^a-z]/g,''),v]));let date=excelDate(m.date||m.bookingdate),team=String(m.team||m.function||'').trim(),topic=String(m.topic||m.campaign||m.posttopic||m.content||'').trim(),time=String(m.time||m.slot||m.start||'').trim().toLowerCase().replace(/\s/g,'');let problems=[];if(!date||!team||!topic)problems.push('Missing date, team or topic');let day=date?((dateOf(date).getDay()+6)%7+1):0;let candidates=slots.filter(s=>s.active&&s.kind==='adhoc'&&s.weekday===day);if(time){let normalized=time.match(/(\d{1,2})(?::(\d{2}))?(am|pm)?/);if(normalized){let h=+normalized[1];if(normalized[3])h=(h%12)+(normalized[3]==='pm'?12:0);let min=h*60+ +(normalized[2]||0);candidates=candidates.filter(s=>mins(s.start_time)===min)}}if(candidates.length!==1)problems.push(candidates.length?'Ambiguous ad-hoc slot; specify time':'No matching ad-hoc slot');const slot=candidates[0];if(slot){let key=date+':'+slot.id;if(seen.has(key))problems.push('Clash within import');seen.add(key);if(findBooking(slot.id,date))problems.push('Already booked');if(slotPast(date,slot.end_time))problems.push('Past slot')}if(problems.length)errors.push({row:i+2,details:problems.join('; ')});else prepared.push({slot_id:slot.id,booking_date:date,team,topic,series_name:String(m.series||m.seriesname||'').trim()||null})}issues=prepared;$('#preview').innerHTML=`<p><strong>${prepared.length}</strong> valid rows · <strong>${errors.length}</strong> flagged rows</p>${errors.length?`<div class="tablewrap"><table><tr><th>Row</th><th>Flag</th></tr>${errors.slice(0,100).map(e=>`<tr><td>${e.row}</td><td class="errorline">${esc(e.details)}</td></tr>`).join('')}</table></div>`:''}<button id="doImport" class="btn primary" ${prepared.length?'':'disabled'}>Import ${prepared.length} valid rows</button>`;$('#doImport').onclick=async()=>{if(!confirm(`Import ${issues.length} valid rows? Flagged rows will be skipped.`))return;let ok=0,failed=[];for(const row of issues){let {error}=await sb.from('roster_bookings').insert(row);if(error)failed.push(`${row.booking_date} ${row.team}: ${readErr(error)}`);else ok++}if(failed.length){report(`${ok} imported; ${failed.length} not imported: ${failed.slice(0,4).join(' | ')}`);await load();return}closeModal();await load();uiNotice(`${ok} bookings imported successfully.`)}}
async function login(){root.innerHTML=`<main class="panel auth"><div class="eyebrow">Nanyang Business School</div><h1>Social Media Roster</h1><p>Sign in with your approved NTU email address to view the shared roster.</p><form id="login"><div class="field"><label>Work email</label><input type="email" name="email" placeholder="name@ntu.edu.sg" required/></div><button class="btn primary" type="submit">Send sign-in link</button></form><p id="authMsg" class="muted"></p></main>`;$('#login').onsubmit=async e=>{e.preventDefault();let email=e.target.elements.email.value.trim();let {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:location.origin+location.pathname}});$('#authMsg').textContent=error?'Sign-in failed. Contact the roster administrator if you need access.':'If this account is permitted, you will receive a sign-in email.'}}
let realtimeChannel=null;function activateRealtime(){if(realtimeChannel)return;realtimeChannel=sb.channel('nbs-roster-updates').on('postgres_changes',{event:'*',schema:'public',table:'roster_bookings'},()=>load().catch(console.error)).on('postgres_changes',{event:'*',schema:'public',table:'roster_slots'},()=>load().catch(console.error)).subscribe();document.addEventListener('visibilitychange',()=>{if(!document.hidden&&session)load().catch(console.error)})}
async function start(){activateRealtime();sb.auth.onAuthStateChange((_event,next)=>{session=next;if(!next)login();else setTimeout(()=>load().catch(e=>{root.innerHTML=`<main class="panel auth"><h2>Access restricted</h2><p>${esc(readErr(e))}</p><button id="exit" class="btn">Sign out</button></main>`;$('#exit').onclick=()=>sb.auth.signOut()}),0)});const {data}=await sb.auth.getSession();session=data.session;if(!session)login();else await load().catch(e=>{root.innerHTML=`<main class="panel auth"><h2>Access restricted</h2><p>${esc(readErr(e))}</p></main>`})}start();
</script></body></html>
